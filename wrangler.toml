#:schema node_modules/wrangler/config-schema.json
name = "inoms"
main = "src/worker.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "single-page-application"

[vars]
NODE_VERSION = "20"
# Configure MASTER_ADMIN_PIN, MASTER_PIN, and Supabase credentials securely in Cloudflare Dashboard:
# Workers & Pages -> inoms -> Settings -> Variables and Secrets


